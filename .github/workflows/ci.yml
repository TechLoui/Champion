name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci || npm install
      - run: node -c server.js

  frontend:
    name: Frontend (HTML lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar painel editorial
        run: |
          node --check frontend/js/blog-panel.js
          node --check frontend/js/blog-panel-model.js
          node --check frontend/js/blog-login.js
          node --check frontend/js/admin-auth.js
          node --check frontend/js/blog.js
          node tools/test-blog-panel.cjs
          node tools/test-blog-auth.cjs
          node tools/test-blog-panel-async.cjs
      - name: Validate HTML files exist
        run: |
          test -f frontend/index.html
          test -f frontend/admin.html
          test -f frontend/painel-blog.html
          echo "All entry points present."
