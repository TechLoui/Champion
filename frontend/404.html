<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada · Champion Saúde Animal</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="/assets/img/brand/icon.png" />
  <!-- CSS inline de propósito: esta página também é a resposta para assets que
       não existem, então ela precisa ser leve e não depender de outros arquivos. -->
  <style>
    :root {
      --navy: #16294D;
      --navy-deep: #0D1B33;
      --blue: #1E4C8F;
      --blue-deep: #12315F;
      --ink: #131F35;
      --muted: #64738C;
      --bg: #F7F9FD;
      --line: rgba(22, 41, 77, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 520px;
      text-align: center;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 44px 32px;
      box-shadow: 0 18px 48px rgba(22, 41, 77, 0.08);
    }
    .logo { width: 148px; height: auto; margin-bottom: 28px; }
    .code {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue);
      background: #EAF1FA;
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 26px;
      line-height: 1.25;
      color: var(--navy);
    }
    p {
      margin: 0 0 28px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a.btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }
    a.primary { background: var(--blue); color: #FFFFFF; }
    a.primary:hover { background: var(--blue-deep); }
    a.ghost { border: 1px solid var(--line); color: var(--navy); }
    a.ghost:hover { background: #F2F6FB; }
    .help {
      margin: 28px 0 0;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
    .help a { color: var(--blue); text-decoration: none; }
    .help a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/img/brand/logo.png" alt="Champion Saúde Animal" />
    <span class="code">Erro 404</span>
    <h1>Não encontramos esta página</h1>
    <p>O endereço pode ter mudado ou o link estar incorreto. Você pode voltar para a página inicial ou ver o catálogo completo de produtos.</p>
    <div class="actions">
      <a class="btn primary" href="/">Página inicial</a>
      <a class="btn ghost" href="/produtos">Ver produtos</a>
    </div>
    <p class="help">
      Precisa de ajuda? Ligue <a href="tel:08007231616">0800 723 1616</a>
      ou escreva para <a href="mailto:contato@champion.ind.br">contato@champion.ind.br</a>.
    </p>
  </main>
</body>
</html>
