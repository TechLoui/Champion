<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minha conta · Champion Saúde Animal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/assets/img/brand/icon.png" />
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0D1117 0%, #1A2030 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #131F35;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 40px 36px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    }
    .logo { width: 130px; display: block; margin: 0 auto 28px; }
    .eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: #1E4C8F; text-align: center; margin-bottom: 6px;
    }
    h1 {
      font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 800;
      text-align: center; margin-bottom: 6px;
    }
    .sub { font-size: 14px; color: #687080; text-align: center; margin-bottom: 26px; }

    .tabs {
      display: flex;
      gap: 4px;
      background: #F4F5F8;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tabs button {
      flex: 1; border: none; background: transparent;
      padding: 9px 12px; font-family: inherit; font-size: 13.5px; font-weight: 600;
      color: #687080; border-radius: 7px; cursor: pointer;
      transition: all .15s;
    }
    .tabs button.is-active { background: #131F35; color: white; }

    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600;
      color: #131F35; margin-bottom: 6px;
    }
    .field input, .field select {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #E4E8EF; border-radius: 9px;
      font-family: inherit; font-size: 14px;
      background: #F9FAFB; color: #131F35; outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .field input:focus, .field select:focus {
      border-color: #1E4C8F; background: white;
      box-shadow: 0 0 0 3px rgba(30,76,143,.1);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .feedback {
      font-size: 13px; font-weight: 600; min-height: 20px; margin-bottom: 12px;
    }
    .feedback.error {
      padding: 10px 12px; border-radius: 8px;
      background: #FFF1EF; border: 1px solid #FAD0C6; color: #12315F;
    }
    .feedback.success {
      padding: 10px 12px; border-radius: 8px;
      background: #EDFAF3; border: 1px solid #A8E6C6; color: #1A7A48;
    }

    .btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg,#2F6BC4,#1E4C8F 55%,#12315F);
      color: white; font-family: 'Sora', sans-serif;
      font-size: 15px; font-weight: 700;
      border: none; border-radius: 10px; cursor: pointer;
      box-shadow: 0 6px 20px -4px rgba(30,76,143,.5);
      transition: transform .18s, box-shadow .18s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px -4px rgba(30,76,143,.55); }

    .btn-google {
      width: 100%; padding: 12px;
      background: white; color: #131F35;
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
      border: 1.5px solid #E4E8EF; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background .15s, border-color .15s;
    }
    .btn-google:hover { background: #F9FAFB; border-color: #D7DCE5; }
    .btn-google:disabled { opacity: .6; cursor: default; }
    .btn-google svg { width: 18px; height: 18px; }
    .divider {
      display: flex; align-items: center; text-align: center;
      color: #A0A8B4; font-size: 12px; margin: 16px 0;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #E8EBF0; }
    .divider span { padding: 0 12px; }

    .panel { display: none; }
    .panel.is-active { display: block; }

    .foot {
      margin-top: 22px; font-size: 12px; color: #A0A8B4; text-align: center;
    }
    .foot a { color: #687080; text-decoration: none; }
    .foot a:hover { color: #131F35; }

    /* Mobile polish */
    @media (max-width: 480px) {
      body { padding: 16px; align-items: flex-start; padding-top: 32px; }
      .card { padding: 28px 22px; border-radius: 16px; }
      .logo { width: 110px; margin-bottom: 22px; }
      h1 { font-size: 22px; }
      .sub { font-size: 13.5px; margin-bottom: 22px; }
      .tabs { margin-bottom: 20px; }
      .tabs button { font-size: 13px; padding: 10px 8px; min-height: 40px; }
      .field input, .field select { font-size: 16px; padding: 13px 14px; }
      .row { grid-template-columns: 1fr; gap: 0; }
      .btn { padding: 14px; font-size: 15px; min-height: 48px; }
    }
    @media (max-width: 380px) {
      body { padding: 12px; padding-top: 24px; }
      .card { padding: 22px 18px; }
    }
  </style>
  <!-- Meta Pixel: código base + PageView. O evento de compra fica na Shopify (ver js/meta-pixel.js). -->
  <script src="/js/meta-pixel.js?v=20260828-6"></script>
  <!-- Google Ads (gtag.js). A conversão de compra fica na Shopify (ver js/google-ads.js). -->
  <script src="/js/google-ads.js?v=20260828-6"></script>
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>

<div class="card">
  <img class="logo" src="/assets/img/brand/logo.png" alt="Champion Saúde Animal" />
  <div class="eyebrow">Área do cliente</div>
  <h1 id="title">Acessar minha conta</h1>
  <p class="sub" id="subtitle">Acompanhe pedidos, dados de entrega e histórico de compras.</p>

  <div class="tabs" role="tablist">
    <button class="is-active" data-tab="login" type="button">Já tenho conta</button>
    <button data-tab="signup" type="button">Criar conta</button>
  </div>

  <div class="feedback" id="feedback"></div>

  <!-- Google (login e cadastro em uma ação) -->
  <button type="button" class="btn-google" id="googleBtn">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
    Continuar com Google
  </button>
  <div class="divider"><span>ou com e-mail</span></div>

  <!-- LOGIN -->
  <div class="panel is-active" data-panel="login">
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" name="email" type="email" autocomplete="username" required placeholder="seu@email.com" />
      </div>
      <div class="field">
        <label for="loginPassword">Senha</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      </div>
      <button class="btn" type="submit">Entrar</button>
      <p style="text-align:center;margin-top:14px">
        <a href="#" id="forgotLink" style="font-size:13px;color:#687080;text-decoration:none">Esqueci minha senha</a>
      </p>
    </form>
  </div>

  <!-- SIGNUP -->
  <div class="panel" data-panel="signup">
    <form id="signupForm" novalidate>
      <div class="field">
        <label for="suName">Nome completo</label>
        <input id="suName" name="name" type="text" autocomplete="name" required placeholder="Como devemos te chamar" />
      </div>
      <div class="field">
        <label for="suEmail">E-mail</label>
        <input id="suEmail" name="email" type="email" autocomplete="email" required placeholder="seu@email.com" />
      </div>
      <div class="row">
        <div class="field">
          <label for="suPhone">Telefone / WhatsApp</label>
          <input id="suPhone" name="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000" />
        </div>
        <div class="field">
          <label for="suProfile">Perfil</label>
          <select id="suProfile" name="profile">
            <option value="pessoa-fisica">Pessoa física</option>
            <option value="pecuarista">Pecuarista / fazenda</option>
            <option value="revenda">Revenda</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="suDoc">CPF / CNPJ</label>
        <input id="suDoc" name="cpfCnpj" type="text" placeholder="000.000.000-00" />
      </div>
      <div class="field">
        <label for="suPassword">Senha (mín. 6 caracteres)</label>
        <input id="suPassword" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="••••••••" />
      </div>
      <button class="btn" type="submit">Criar conta</button>
    </form>
  </div>

  <div class="foot">
    <a href="/">← Voltar ao site</a>
  </div>
</div>

<script src="/js/customer-store.js?v=20260828-6"></script>
<script>
(function () {
  var feedback = document.getElementById('feedback');

  function showError(msg) {
    feedback.className = 'feedback error';
    feedback.textContent = msg;
  }
  function showSuccess(msg) {
    feedback.className = 'feedback success';
    feedback.textContent = msg;
  }
  function clearFeedback() {
    feedback.className = 'feedback';
    feedback.textContent = '';
  }

  /* If already logged in, redirect to minha-conta */
  if (window.ChampionCustomers && window.ChampionCustomers.isLogged()) {
    var redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';
    location.replace(redirect);
    return;
  }

  /* Tab switching */
  var tabs = document.querySelectorAll('.tabs button');
  var panels = document.querySelectorAll('[data-panel]');
  tabs.forEach(function (b) {
    b.addEventListener('click', function () {
      var tab = b.getAttribute('data-tab');
      tabs.forEach(function (x) { x.classList.toggle('is-active', x === b); });
      panels.forEach(function (p) { p.classList.toggle('is-active', p.getAttribute('data-panel') === tab); });
      clearFeedback();
      document.getElementById('title').textContent = tab === 'signup' ? 'Criar minha conta' : 'Acessar minha conta';
      document.getElementById('subtitle').textContent = tab === 'signup'
        ? 'Crie sua conta para finalizar pedidos e acompanhar entregas.'
        : 'Acompanhe pedidos, dados de entrega e histórico de compras.';
    });
  });

  /* Login */
  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearFeedback();
    var email = document.getElementById('loginEmail').value;
    var password = document.getElementById('loginPassword').value;
    try {
      await window.ChampionCustomers.login(email, password);
      var redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';
      showSuccess('Bem-vindo de volta! Redirecionando…');
      setTimeout(function () { location.replace(redirect); }, 600);
    } catch (err) {
      showError(err.message || 'Não foi possível entrar.');
    }
  });

  /* Login / cadastro com Google */
  document.getElementById('googleBtn').addEventListener('click', async function () {
    clearFeedback();
    var btn = this;
    btn.disabled = true;
    try {
      await window.ChampionCustomers.loginWithGoogle();
      var redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';
      showSuccess('Conectado com Google! Redirecionando…');
      setTimeout(function () { location.replace(redirect); }, 600);
    } catch (err) {
      showError(err.message || 'Não foi possível entrar com o Google.');
      btn.disabled = false;
    }
  });

  /* Esqueci minha senha — envia e-mail de redefinição (Firebase Auth) */
  document.getElementById('forgotLink').addEventListener('click', async function (e) {
    e.preventDefault();
    clearFeedback();
    var email = document.getElementById('loginEmail').value.trim();
    if (!email) {
      showError('Digite seu e-mail no campo acima e clique em "Esqueci minha senha".');
      document.getElementById('loginEmail').focus();
      return;
    }
    try {
      await window.ChampionCustomers.resetPassword(email);
      showSuccess('Se houver uma conta com esse e-mail, enviamos as instruções para redefinir a senha. Confira sua caixa de entrada e o spam.');
    } catch (err) {
      showError(err.message || 'Não foi possível enviar o e-mail de redefinição.');
    }
  });

  /* Signup */
  document.getElementById('signupForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    clearFeedback();
    var input = {
      name: document.getElementById('suName').value,
      email: document.getElementById('suEmail').value,
      phone: document.getElementById('suPhone').value,
      profile: document.getElementById('suProfile').value,
      cpfCnpj: document.getElementById('suDoc').value,
      password: document.getElementById('suPassword').value
    };
    try {
      await window.ChampionCustomers.register(input);
      var redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';
      showSuccess('Conta criada! Redirecionando…');
      setTimeout(function () { location.replace(redirect); }, 600);
    } catch (err) {
      showError(err.message || 'Não foi possível criar a conta.');
    }
  });
})();
</script>
</body>
</html>
