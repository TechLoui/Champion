<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finalizar compra · Champion Saúde Animal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/img/brand/icon.png" />
  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #F7F9FD;
      color: #131F35;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    .topbar {
      background: white;
      border-bottom: 1px solid #E5E8EF;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar img { width: 110px; }
    .topbar .back { font-size: 13px; color: #687080; text-decoration: none; }
    .topbar .back:hover { color: #131F35; }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 24px 80px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 880px) { .wrap { grid-template-columns: 1fr; } }

    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .lead { color: #687080; margin-bottom: 24px; font-size: 14px; }

    .steps {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .step {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      background: white;
      border: 1.5px solid #E5E8EF;
      font-size: 12.5px;
      font-weight: 600;
      color: #687080;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .step .num {
      width: 22px; height: 22px; border-radius: 50%;
      background: #F0F2F6; color: #687080;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
    }
    .step.is-active { border-color: #1E4C8F; color: #1E4C8F; background: #FFF9F7; }
    .step.is-active .num { background: #1E4C8F; color: white; }
    .step.is-done { color: #1A7A48; border-color: #A8E6C6; background: #EDFAF3; }
    .step.is-done .num { background: #1A9B5F; color: white; }

    .card {
      background: white;
      border: 1px solid #E5E8EF;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-family: 'Sora', sans-serif;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 13px;
      border: 1.5px solid #E4E8EF;
      border-radius: 8px;
      background: #F9FAFB;
      font-family: inherit; font-size: 14px;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: #1E4C8F; background: white;
      box-shadow: 0 0 0 3px rgba(30,76,143,.09);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .row, .row3 { grid-template-columns: 1fr; } }

    .pay-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 600px) { .pay-options { grid-template-columns: 1fr; } }
    .pay-options label {
      border: 1.5px solid #E4E8EF;
      border-radius: 10px;
      padding: 14px 12px;
      cursor: pointer;
      text-align: center;
      transition: border-color .18s, background .18s;
      font-weight: 600; font-size: 13.5px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .pay-options label:hover { border-color: #1E4C8F; }
    .pay-options input { display: none; }
    .pay-options input:checked + span { color: #1E4C8F; }
    .pay-options label:has(input:checked) { border-color: #1E4C8F; background: #FFF9F7; }

    .btn {
      padding: 12px 22px; border-radius: 9px;
      font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700;
      border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      transition: transform .18s, box-shadow .18s, background .18s;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg,#2F6BC4,#1E4C8F 60%,#12315F);
      color: white;
      box-shadow: 0 6px 20px -4px rgba(30,76,143,.5);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px -4px rgba(30,76,143,.55); }
    .btn-ghost {
      background: transparent; color: #687080;
      border: 1.5px solid #E4E8EF;
    }
    .btn-ghost:hover { background: #F4F5F8; color: #131F35; }
    .actions { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 4px; }

    /* Summary */
    .summary {
      background: white;
      border: 1px solid #E5E8EF;
      border-radius: 14px;
      padding: 22px;
      position: sticky;
      top: 16px;
    }
    .summary h2 {
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .summary-list { list-style: none; }
    .summary-item {
      display: flex; gap: 10px; padding: 10px 0;
      border-bottom: 1px solid #F0F2F6;
    }
    .summary-item img {
      width: 44px; height: 44px;
      border-radius: 7px;
      background: #F4F5F8;
      object-fit: contain;
      padding: 4px;
      border: 1px solid #EEF0F4;
    }
    .summary-item-info { flex: 1; min-width: 0; }
    .summary-item-info h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .summary-item-info p { font-size: 12px; color: #9EA6B4; }
    .summary-item-price { font-size: 13px; font-weight: 600; }
    .totals { padding-top: 12px; }
    .totals-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: #687080; }
    .totals-row.total { font-size: 17px; font-weight: 800; color: #131F35; margin-top: 8px; padding-top: 10px; border-top: 1px solid #F0F2F6; font-family: 'Sora',sans-serif; }
    .empty {
      text-align: center; padding: 28px 12px;
      color: #9EA6B4; font-size: 13.5px;
    }

    .feedback {
      font-size: 13px; font-weight: 600; min-height: 20px; margin: 10px 0;
    }
    .feedback.error {
      padding: 10px 12px; border-radius: 8px;
      background: #FFF1EF; border: 1px solid #FAD0C6; color: #12315F;
    }

    /* Mobile polish */
    @media (max-width: 720px) {
      .topbar { padding: 12px 16px; }
      .topbar img { width: 90px; }
      .topbar .back { font-size: 12px; }
      .wrap { padding: 18px 14px 60px; gap: 18px; }
      h1 { font-size: 22px; }
      .lead { font-size: 13px; margin-bottom: 18px; }
      .card { padding: 18px; margin-bottom: 12px; border-radius: 12px; }
      .steps { gap: 4px; margin-bottom: 18px; flex-wrap: wrap; }
      .step { padding: 10px 10px; font-size: 11.5px; gap: 6px; }
      .step .num { width: 18px; height: 18px; font-size: 10px; }
      .field input, .field select, .field textarea {
        padding: 13px 13px;
        font-size: 16px; /* evita zoom iOS */
      }
      .actions { flex-direction: column-reverse; align-items: stretch; gap: 8px; }
      .actions .btn { width: 100%; justify-content: center; }
      .summary { padding: 18px; border-radius: 12px; position: static; }
      .summary-item img { width: 40px; height: 40px; }
      .success-card { margin: 30px 14px; padding: 30px 22px; }
    }
    @media (max-width: 480px) {
      .steps .step span:not(.num) { font-size: 10.5px; }
      .pay-options label { padding: 12px 10px; font-size: 12.5px; }
    }

    /* Success view */
    .success-card {
      background: white;
      border: 1px solid #E5E8EF;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      max-width: 560px;
      margin: 60px auto;
    }
    .success-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg,#1A9B5F,#0F7C46);
      color: white;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
    }
    .success-icon svg { width: 32px; height: 32px; }
    .success-card h1 { margin-bottom: 8px; }
    .success-card p { color: #687080; margin-bottom: 22px; }
    .success-meta {
      display: inline-flex; align-items: center; gap: 12px;
      background: #F4F5F8; padding: 10px 16px; border-radius: 10px;
      margin-bottom: 22px; font-size: 13.5px;
    }
    .success-meta strong { font-family: 'Sora',sans-serif; font-size: 16px; }

    /* ─── Checkout Shopify (etapa de revisão) ─── */
    .co-steps-card { padding: 6px 24px; }
    .co-steps { list-style: none; }
    .co-steps li {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 16px 0; border-bottom: 1px solid #F0F2F6;
    }
    .co-steps li:last-child { border-bottom: 0; }
    .co-num {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      background: #F0F2F6; color: #687080;
      font-family: 'Sora', sans-serif; font-weight: 800; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
    }
    .co-num.is-done { background: linear-gradient(135deg,#1A9B5F,#0F7C46); color: #fff; }
    .co-step-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .co-step-txt strong { font-size: 14.5px; font-weight: 600; }
    .co-step-txt span { font-size: 13px; color: #687080; line-height: 1.45; }
    .co-step-txt span strong { color: #131F35; }
    .co-pay-btn {
      width: 100%; justify-content: center;
      padding: 16px 24px; font-size: 15.5px; margin-top: 2px;
    }
    .co-pay-btn svg { width: 18px; height: 18px; }
    .co-secure-note {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      margin-top: 14px; font-size: 12px; color: #9EA6B4; text-align: center;
    }
    .co-secure-note svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* Mobile: resumo do pedido aparece primeiro (mostra o total antes do botão) */
    @media (max-width: 880px) {
      .summary { order: -1; margin-bottom: 4px; }
      .co-steps-card { padding: 4px 18px; }
      .co-pay-btn { padding: 15px 20px; font-size: 15px; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <a href="index.html"><img src="assets/img/brand/logo.png" alt="Champion" /></a>
  <a class="back" href="index.html">← Continuar comprando</a>
</div>

<!-- ─── Checkout (steps 1-3) ─── -->
<div class="wrap" id="checkoutWrap">
  <div>
    <h1>Finalizar compra</h1>
    <p class="lead">Preparando seu pedido…</p>
  </div>
  <!-- Order summary (sticky) -->
  <aside class="summary">
    <h2>Resumo do pedido</h2>
    <ul class="summary-list" id="summaryItems"></ul>
    <div class="totals" id="totals"></div>
  </aside>
</div>


<script src="js/customer-store.js?v=20260609-2"></script>
<script src="js/order-store.js"></script>
<script>
(async function () {
  var CART_KEY = 'champion-cart';

  /* ─── Configuração Pagar.me / backend ───
     PAGARME_PK  → chave PÚBLICA. É pública: pode ficar no frontend. Usada SÓ para
                   tokenizar o cartão no navegador (os dados do cartão nunca passam
                   pelo nosso servidor).
     IMPORTANTE: precisa ser a chave pública de PRODUÇÃO, do MESMO ambiente da
     secret key de produção no Railway (PAGARME_SECRET_KEY). NÃO use a de teste aqui.
     CHECKOUT_API → backend no Railway (mesma origem usada em contact.js). */
  var PAGARME_PK   = 'COLE_A_PUBLIC_KEY_DE_PRODUCAO'; /* pk de PRODUÇÃO (painel → ambiente Produção) */
  var CHECKOUT_API = 'https://champion-production-cab6.up.railway.app/api/checkout';
  var TOKEN_API    = 'https://api.pagar.me/core/v5/tokens';

  var cart = [];
  try { cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]'); } catch (e) { cart = []; }

  /* If cart empty, send back to index */
  if (!cart.length) {
    document.getElementById('checkoutWrap').innerHTML = '<div class="card" style="margin:auto;max-width:520px;text-align:center"><h2>Carrinho vazio</h2><p style="margin:12px 0 18px;color:#687080">Adicione produtos antes de finalizar a compra.</p><a class="btn btn-primary" href="produtos.html">Ver produtos</a></div>';
    return;
  }

  /* Carrega a sessão do cliente (p/ pré-preencher o e-mail no checkout), SEM forçar login.
     No fluxo Shopify, o cliente se identifica no próprio checkout hospedado — não exigimos
     login no nosso site. O gate de login (legado Pagar.me) fica logo abaixo, só se o
     Shopify estiver desligado. */
  if (window.ChampionCustomers) {
    try { await window.ChampionCustomers.ready; } catch (e) {}
  }

  function fmt(v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); }

  /* ─── Modo Shopify (FASE 2): checkout hospedado via redirect ───
     Só ativa quando shopify-config.js estiver preenchido. Caso contrário, o
     código segue no fluxo Pagar.me abaixo, sem qualquer alteração. */
  function renderShopifyCheckout(items, shopify) {
    var current = window.ChampionCustomers && window.ChampionCustomers.currentSession();
    var email = current && current.email ? current.email : '';
    var subtotal = items.reduce(function (s, i) { return s + (Number(i.price) || 0) * (Number(i.qty) || 1); }, 0);

    document.getElementById('summaryItems').innerHTML = items.map(function (i) {
      return '<li class="summary-item">'
        + (i.image ? '<img src="' + i.image + '" alt="" />' : '<div class="summary-item-img" style="width:44px;height:44px;background:#F4F5F8;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#9EA6B4">' + (i.name || '?').charAt(0) + '</div>')
        + '<div class="summary-item-info"><h4>' + (i.name || 'Produto') + '</h4><p>' + (i.qty || 1) + '× · ' + fmt(i.price) + '</p></div>'
        + '<div class="summary-item-price">' + fmt((i.price || 0) * (i.qty || 1)) + '</div></li>';
    }).join('');
    document.getElementById('totals').innerHTML =
      '<div class="totals-row"><span>Subtotal</span><span>' + fmt(subtotal) + '</span></div>'
      + '<div class="totals-row total"><span>Total</span><span>' + fmt(subtotal) + '</span></div>'
      + '<div class="totals-row" style="margin-top:8px;color:#9EA6B4;font-size:12px">Frete e pagamento são calculados na próxima etapa, no ambiente seguro.</div>';

    var lock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
    var idText = email
      ? 'Conectado como <strong>' + email + '</strong>'
      : 'Você informa e-mail e endereço na próxima etapa.';
    var left = document.querySelector('#checkoutWrap > div');
    left.innerHTML =
      '<h1>Finalizar compra</h1>'
      + '<p class="lead">Revise seu pedido abaixo. Na próxima etapa você informa a entrega e conclui o pagamento com total segurança.</p>'
      + '<div class="card co-steps-card">'
      +   '<ol class="co-steps">'
      +     '<li><span class="co-num is-done"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><div class="co-step-txt"><strong>Pedido montado</strong><span>Seus itens estão no resumo.</span></div></li>'
      +     '<li><span class="co-num">2</span><div class="co-step-txt"><strong>Identificação e entrega</strong><span>' + idText + '</span></div></li>'
      +     '<li><span class="co-num">3</span><div class="co-step-txt"><strong>Pagamento seguro</strong><span>Pix, cartão ou boleto em ambiente protegido.</span></div></li>'
      +   '</ol>'
      + '</div>'
      + '<div class="feedback" id="feedback"></div>'
      + '<button class="btn btn-primary co-pay-btn" id="goPay" type="button">' + lock + ' Ir para o pagamento seguro →</button>'
      + '<p class="co-secure-note">' + lock + ' Ambiente criptografado — seus dados de pagamento não passam pelo nosso site.</p>';

    var fb = document.getElementById('feedback');
    var btn = document.getElementById('goPay');
    btn.addEventListener('click', async function () {
      fb.className = 'feedback'; fb.textContent = '';
      btn.disabled = true; btn.textContent = 'Redirecionando…';
      try {
        var lines = items.map(function (i) { return { variantId: i.variantId, qty: i.qty, id: i.id }; });
        /* Blindagem contra carrinhos antigos (itens salvos antes do variantId):
           resolve o GID pelo Shopify a partir do id do item (handle|variante). */
        if (lines.some(function (l) { return !l.variantId; })) {
          var prods = await shopify.getShopifyProducts();
          var byHandle = {};
          prods.forEach(function (p) { byHandle[p.id] = p; });
          lines.forEach(function (l) {
            if (l.variantId) return;
            var parts = String(l.id || '').split('|');
            var p = byHandle[parts[0]];
            if (!p) return;
            if (parts[1]) {
              var v = (p.variants || []).find(function (x) { return x.id === parts[1]; });
              if (v) l.variantId = v.variantId;
            } else {
              l.variantId = p.variantId;
            }
          });
        }
        var payload = lines.map(function (l) { return { variantId: l.variantId, qty: l.qty }; });
        var url = await shopify.createShopifyCheckout(payload, email);
        try { localStorage.removeItem(CART_KEY); } catch (e) {}
        window.location.href = url;
      } catch (err) {
        fb.className = 'feedback error';
        fb.textContent = (err && err.message) || 'Não foi possível iniciar o checkout.';
        btn.disabled = false; btn.textContent = 'Ir para o pagamento seguro →';
      }
    });
  }

  try {
    var shopifyMod = await import('./js/shopify-client.js');
    if (shopifyMod.isShopifyEnabled()) {
      renderShopifyCheckout(cart, shopifyMod);
      return;
    }
  } catch (e) { /* módulo indisponível → segue o fluxo Pagar.me padrão */ }

  /* Checkout 100% Shopify. Se o Shopify nao estiver configurado, exibe indisponibilidade
     (o fluxo Pagar.me legado foi removido nesta migracao). */
  document.getElementById('checkoutWrap').innerHTML =
    '<div class="card" style="margin:auto;max-width:520px;text-align:center">'
    + '<h2>Checkout indisponivel no momento</h2>'
    + '<p style="margin:12px 0 18px;color:#687080">Nao foi possivel iniciar o pagamento. Tente novamente em instantes.</p>'
    + '<a class="btn btn-primary" href="produtos.html">Voltar a loja</a></div>';

})();
</script>
</body>
</html>
